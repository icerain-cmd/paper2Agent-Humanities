events { worker_connections 256; }
pid /home/leeyongwook/.local/state/paper2agent-humanities/nginx/nginx.pid;
error_log /home/leeyongwook/.local/state/paper2agent-humanities/logs/nginx-error.log;
http {
    access_log /home/leeyongwook/.local/state/paper2agent-humanities/logs/nginx-access.log;
    client_max_body_size 30M;
    server {
        listen 127.0.0.1:8766;
        server_name localhost;
        location / {
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 30s;
            chunked_transfer_encoding on;
        }
    }
}
